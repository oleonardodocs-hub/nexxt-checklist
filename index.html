<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · Gestão de Mídias Sociais</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/logo.png" alt="" style="height:32px; margin-bottom:14px;" />
      <h1>Gestão de Mídias Sociais</h1>
      <p>Digite a senha de acesso da equipe.</p>

      <form id="form-login">
        <div class="field">
          <label for="senha">Senha de acesso</label>
          <input type="password" id="senha" required autocomplete="current-password" autofocus />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" id="btn-entrar">Entrar</button>
        <p class="form-msg" id="msg"></p>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    // já entrou antes neste navegador? pula direto pro painel
    if (localStorage.getItem("equipe_autenticada") === "1") {
      window.location.href = "dashboard.html";
    }

    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const senha = document.getElementById("senha").value;
      const msg = document.getElementById("msg");

      if (!window.APP_CONFIG || !window.APP_CONFIG.TEAM_PASSWORD) {
        msg.textContent = "Senha de acesso não configurada. Confira js/config.js.";
        msg.className = "form-msg error";
        return;
      }

      if (senha !== window.APP_CONFIG.TEAM_PASSWORD) {
        msg.textContent = "Senha incorreta.";
        msg.className = "form-msg error";
        return;
      }

      localStorage.setItem("equipe_autenticada", "1");
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
